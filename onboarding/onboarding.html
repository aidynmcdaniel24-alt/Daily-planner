<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://www.google.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://www.gstatic.com; connect-src 'self' https://bible-api.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://www.google.com https://*.google.com https://apis.google.com https://www.gstatic.com https://*.gstatic.com; frame-src https://daily-planner-8801e.firebaseapp.com https://accounts.google.com https://www.google.com https://apis.google.com https://www.recaptcha.net; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<title>Setup</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0a0c12">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@500..600&display=swap">

</head>
<body>
<div class="titlebar" aria-hidden="true"><span>Daily Planner</span></div>
<main class="obm">
 <h1>Let's build your plan</h1>
 <p class="mute" id="stp"></p>
 <div class="bar"><i id="pg"></i></div>
 <div class="card">
  <h2 id="q"></h2>
  <p class="mute" id="hint" style="margin-top:4px"></p>
  <div id="ans"></div>
 </div>
 <div class="row"><button id="bk">Back</button><button id="nx" class="pri">Next</button></div>
 <p class="ob-imp" id="impw"><button type="button" class="link" id="imp">Have a backup file? Import it</button></p>
 <input type="file" id="impf" accept=".json,application/json" hidden>
</main>
<script src="../genres.js"></script>
<script src="../content.js"></script>
<script src="onboarding.js"></script>
<script type="module" src="../remote.js"></script>
<script type="module" src="../ai.js"></script>
</body>
</html>
