<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaderboard · Daily Planner</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0a0c12">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@500..600&display=swap">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main>
<button type="button" class="back" id="bk">
 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
 Back to planner
</button>
<header class="top">
 <div><h1>Leaderboard</h1><p class="sub">Compare streaks with your friends.</p></div>
 <div class="pf" id="pf"></div>
</header>

<div id="st" class="card"><p class="mute" style="margin:0">Loading…</p></div>

<div id="app" hidden>
 <div class="card">
  <h2>Your friend code</h2>
  <p class="mute" style="margin:4px 0 0">Share it so friends can add you.</p>
  <div class="codebox"><span id="my"></span><button type="button" id="cp">Copy</button></div>
  <label class="l" for="dn" style="margin-top:14px">Name shown to friends</label>
  <input type="text" id="dn" maxlength="24">
 </div>

 <div class="card">
  <div class="head"><h2>Friends</h2><span class="mute" id="cnt" style="margin:0"></span></div>
  <ol class="lb" id="lb"></ol>
  <form id="af" class="addf">
   <label class="l" for="fc">Add a friend by code</label>
   <div class="addrow"><input type="text" id="fc" maxlength="6" placeholder="ABC123" autocomplete="off" autocapitalize="characters"><button type="submit" class="pri">Add</button></div>
   <p id="er" class="err" hidden></p>
  </form>
 </div>

 <div class="row"><button type="button" id="lv" class="danger">Leave the leaderboard</button></div>
</div>
</main>
<script type="module" src="leaderboard.js"></script>
<script type="module" src="../sync.js"></script>
</body>
</html>
