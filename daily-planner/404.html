<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@600&display=swap">
<style>
:root{--bg:#f5f6fa;--panel:#fff;--text:#11131a;--mute:#646a7d;--line:#e4e6ee;--acc:#6d5cff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0a0c12;--panel:#12151e;--text:#e8eaf1;--mute:#8a90a4;--line:#1e2230;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:15px/1.55 "Geist",system-ui,sans-serif;text-align:center;
 background-image:radial-gradient(700px 320px at 50% -120px,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%)}
.code{font:600 clamp(72px,22vw,120px)/1 "Geist Mono",monospace;letter-spacing:-.05em;margin:0;
 background:linear-gradient(180deg,var(--text),color-mix(in srgb,var(--text) 25%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:22px;letter-spacing:-.02em;margin:12px 0 6px}
p{color:var(--mute);margin:0 0 24px;max-width:340px}
a{display:inline-block;background:var(--acc);color:#fff;font-weight:600;text-decoration:none;padding:12px 20px;border-radius:10px}
a:hover{filter:brightness(1.1)}
a:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
</style>
</head>
<body>
<main>
 <p class="code">404</p>
 <h1>This page took a wrong rotation</h1>
 <p>The page you're looking for doesn't exist or was moved.</p>
 <a id="home" href="/">Back to my planner</a>
</main>
<script>
// On GitHub Pages project sites, home is /repo-name/ instead of /
if(location.hostname.slice(-10)==="github.io"){var seg=location.pathname.split("/")[1];if(seg)document.getElementById("home").href="/"+seg+"/"}
</script>
</body>
</html>
