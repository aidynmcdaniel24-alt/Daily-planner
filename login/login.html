<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign In · Daily Planner</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0a0c12">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@500..600&display=swap">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="obm auth">
 <div class="brand">
  <span class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M8.5 15l2.5 2.5 4.5-5"/></svg></span>
  <span>Daily Planner</span>
 </div>

 <div class="card auth-card">
  <h1 id="ttl">Welcome back</h1>
  <p class="sub" id="sub2">Log in to sync your plan across devices.</p>

  <div class="tabs" id="lt"><button type="button" data-m="in" aria-selected="true">Log in</button><button type="button" data-m="up" aria-selected="false">Sign up</button></div>

  <form id="f" novalidate>
   <div class="field">
    <label class="l" for="em">Email</label>
    <input type="email" id="em" autocomplete="email" placeholder="you@example.com" required aria-describedby="er">
   </div>
   <div class="field">
    <div class="lrow"><label class="l" for="pw">Password</label><button type="button" id="fp" class="link">Forgot password?</button></div>
    <div class="pw"><input type="password" id="pw" autocomplete="current-password" placeholder="Your password" required><button type="button" id="sh" class="eye">Show</button></div>
   </div>
   <p id="er" class="err" hidden></p>
   <button type="submit" id="go" class="pri wide">Log in</button>
  </form>

  <div class="or">or</div>
  <button type="button" id="gg" class="wide">Continue with Google</button>
 </div>

 <p class="foot"><button type="button" id="gs" class="link">Continue without an account</button></p>
</main>
<script type="module" src="login.js"></script>
</body>
</html>
